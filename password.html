<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>账号安全</title><link rel="stylesheet" href="/css/workbench.css"><body class="workbench-body"><div id="shell"></div><main class="workbench-main"><h1>账号安全</h1><section class="users-card"><h2>修改密码</h2><form id="f"><input name="oldPassword" type="password" placeholder="当前密码" required><input name="newPassword" type="password" placeholder="新密码（至少8位）" required minlength="8"><button class="workbench-primary">保存新密码</button></form><p id="m"></p><hr><h2>手机号绑定（预留）</h2><p class="workbench-muted">手机号字段已预留，短信服务接入后启用。</p><h2>忘记密码（本地演示）</h2><p class="workbench-muted">演示环境可由管理员在“用户与权限”中重置账号密码。</p></section></main><script src="/js/workbench-session.js"></script><script src="/js/workbench-shell.js"></script><script>(async()=>{const s=WorkbenchSession.createSessionClient(),m=document.querySelector('#m');const i=await s.getIdentity();WorkbenchShell.mountShell({container:document.querySelector('#shell'),activeModule:'security',identity:i,onLogout:async()=>{await s.logout();location='/login.html'}});document.querySelector('#f').onsubmit=async e=>{e.preventDefault();const r=await s.authorizedFetch('/api/auth/password',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});const d=await r.json();m.textContent=r.ok?'密码已修改':(d.error||'修改失败');};})();</script></body></html>
