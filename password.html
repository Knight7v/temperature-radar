<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>账号安全 · 观星台</title><link rel="icon" type="image/svg+xml" href="/assets/brand/guanxingtai.svg"><link rel="stylesheet" href="/css/workbench.css?v=20261030-skel2"><style>
.pw-root{--s-card:#fff;--s-line:#e5eaf2;--s-line-strong:#d4dce8;--s-ink:#1a2333;--s-ink-2:#3a4a63;--s-sub:#708097;--s-faint:#9aa7ba;--s-blue:#2563eb;--s-blue-soft:#eaf1fe;--s-radius:10px;--s-radius-s:7px;--s-shadow:0 1px 2px rgba(23,35,58,.04)}
.pw-pagehead{display:flex;align-items:flex-start;gap:16px;margin-bottom:6px}
.pw-pagehead .pw-eyebrow{font-size:11px;letter-spacing:.14em;color:var(--s-blue);font-weight:700;margin-bottom:2px}
.pw-pagehead h1{font-size:22px;font-weight:700;margin:0}
.pw-pagehead .pw-desc{font-size:13px;color:var(--s-sub);margin:3px 0 0}
.pw-card{background:var(--s-card);border:1px solid var(--s-line);border-radius:var(--s-radius);box-shadow:var(--s-shadow);max-width:520px;padding:20px 22px;margin:16px 0 16px}
.pw-card h2{font-size:15px;font-weight:700;margin:0 0 14px;color:var(--s-ink)}
.pw-field{display:grid;gap:6px;margin-bottom:14px}
.pw-field label{font-size:13px;font-weight:600;color:var(--s-ink-2)}
.pw-field input{height:38px;padding:0 12px;border:1px solid var(--s-line-strong);border-radius:var(--s-radius-s);font-size:14px;font-family:inherit;background:var(--s-card);color:var(--s-ink)}
.pw-field input:focus-visible{outline:2px solid #9dbcf5;outline-offset:1px;border-color:#9dbcf5}
.pw-hint{font-size:12px;color:var(--s-faint);margin:-6px 0 14px}
.workbench-body .pw-btn{height:36px;padding:0 18px;border:0;border-radius:var(--s-radius-s);background:var(--s-blue);color:#fff;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;box-shadow:0 1px 2px rgba(37,99,235,.28)}
.workbench-body .pw-btn:hover{background:#1d4fd7}
.pw-msg{font-size:13px;margin:12px 0 0;min-height:0}
.pw-msg.ok{color:#16a34a}.pw-msg.err{color:#dc2626}
.pw-msg:empty{margin:0}
.pw-muted-block{border-top:1px dashed var(--s-line-strong);margin-top:18px;padding-top:14px}
.pw-muted-block h2{font-size:13.5px;margin:0 0 6px}
.pw-muted-block p{font-size:12.5px;color:var(--s-sub);margin:0 0 10px;line-height:1.7}
.pw-log{list-style:none;margin:0;padding:0}
.pw-log li{display:flex;align-items:baseline;gap:10px;padding:9px 2px;border-top:1px solid var(--s-line);font-size:12.5px;color:var(--s-ink-2)}
.pw-log li:first-child{border-top:none}
.pw-log .t{color:var(--s-faint);white-space:nowrap;font-variant-numeric:tabular-nums}
.pw-log .now{color:var(--s-blue);font-weight:600}
.pw-log-empty{font-size:12.5px;color:var(--s-faint);margin:4px 0 0}
@media(max-width:640px){.pw-card{max-width:none}}
</style></head><body class="workbench-body"><div id="shell"></div><main class="workbench-main pw-root">
<div class="pw-pagehead">
<div>
<div class="pw-eyebrow">ACCOUNT SECURITY</div>
<h1>账号安全</h1>
<p class="pw-desc">修改登录密码；更多安全能力将随版本逐步开放</p>
</div>
</div>
<section class="pw-card">
<h2>修改密码</h2>
<form id="f">
<div class="pw-field"><label for="oldPassword">当前密码</label><input id="oldPassword" name="oldPassword" type="password" autocomplete="current-password" required></div>
<div class="pw-field"><label for="newPassword">新密码</label><input id="newPassword" name="newPassword" type="password" autocomplete="new-password" required minlength="8"></div>
<p class="pw-hint">至少 8 位；建议字母 + 数字组合，不要与旧密码相同</p>
<button class="pw-btn" type="submit">保存新密码</button>
</form>
<p id="m" class="pw-msg" role="status"></p>
<div class="pw-muted-block">
<h2>手机号绑定（预留）</h2>
<p>手机号字段已预留，短信服务接入后启用。</p>
<h2>忘记密码</h2>
<p>请联系管理员在「用户与权限」页面为你的账号重置密码。</p>
</div>
</section>
<section class="pw-card">
<h2>最近登录</h2>
<p class="pw-hint" style="margin-top:-8px">只显示你自己账号的最近 10 次登录；发现不认识的设备请立即改密码并联系管理员。</p>
<ul id="loginLog" class="pw-log"><li style="border:0;color:var(--s-faint)">正在读取…</li></ul>
</section>
</main><script src="/js/workbench-session.js?v=20261030-px1"></script><script src="/js/workbench-shell.js?v=20261030-shell2"></script><script src="/js/notifications-ui.js?v=20261030-ntf1"></script><script src="/js/command-palette.js?v=20261030-cmdk2"></script><script>(async()=>{const s=WorkbenchSession.createSessionClient(),m=document.querySelector('#m');let i;try{i=await s.getIdentity();}catch{location.replace('/login.html?returnTo=%2Fpassword.html');return;}WorkbenchShell.mountShell({container:document.querySelector('#shell'),activeModule:'security',identity:i,onLogout:async()=>{await s.logout();location='/login.html'}});document.querySelector('#f').onsubmit=async e=>{e.preventDefault();const btn=e.target.querySelector('button');btn.disabled=true;try{const r=await s.authorizedFetch('/api/auth/password',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});const d=await r.json();if(r.ok){m.className='pw-msg ok';m.textContent='密码已修改，下次登录请使用新密码';e.target.reset();}else{m.className='pw-msg err';m.textContent=typeof d.error==='string'?d.error:'修改失败';}}catch{m.className='pw-msg err';m.textContent='网络异常，请重试';}finally{btn.disabled=false;}};
/* 最近登录（P1-4）：服务端从登录留痕里查本人最近 10 条 */
(async()=>{const box=document.querySelector('#loginLog');if(!box)return;try{const r=await s.authorizedFetch('/api/audit?action=mine');const d=await r.json();if(!r.ok)throw Error(typeof d.error==='string'?d.error:'读取失败');const rows=(d.data&&d.data.rows)||[];if(!rows.length){box.innerHTML='<li style="border:0;color:var(--s-faint)">暂无记录——下次登录后这里会开始记录。</li>';return;}box.innerHTML=rows.map((row,idx)=>{let detail=row.detail||{};if(typeof detail==='string'){try{detail=JSON.parse(detail);}catch{detail={};}}const t=new Date(row.createdAt).toLocaleString('zh-CN',{timeZone:'Asia/Shanghai',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false});return '<li'+(idx===0?' class="now"':'')+'><span class="t">'+t+(idx===0?'（本次会话）':'')+'</span><span>'+(detail.ip||'IP 未知')+'</span><span style="color:var(--s-sub)">'+(detail.browser||'')+'</span></li>';}).join('');}catch(e){box.innerHTML='<li style="border:0;color:#a02020">登录记录读取失败：'+e.message+'</li>';}})();
})();</script></body></html>
