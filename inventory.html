<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>库存监控预警 · 公司工作台</title><link rel="stylesheet" href="/css/workbench.css"><style>.inventory-main{max-width:1500px}.inventory-toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:end;background:#fff;border:1px solid #e0e6ef;border-radius:14px;padding:16px;margin:16px 0}.inventory-toolbar label{display:grid;gap:4px;color:#66768a;font-size:12px}.inventory-toolbar input,.inventory-toolbar select{min-height:38px;padding:7px}.inventory-actions{margin-left:auto;display:flex;gap:8px}.inventory-kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.inventory-kpi{background:#fff;border:1px solid #e0e6ef;border-radius:14px;padding:18px}.inventory-kpi strong{display:block;font-size:25px;margin-top:6px}.inventory-table{width:100%;border-collapse:collapse;background:#fff;border:1px solid #e0e6ef;border-radius:12px;overflow:hidden}.inventory-table th,.inventory-table td{padding:12px;border-bottom:1px solid #edf0f4;text-align:left;white-space:nowrap}.inventory-table th{font-size:12px;color:#66768a;background:#f8faff}.inventory-table th:nth-child(2),.inventory-table td:nth-child(2){width:300px;min-width:300px;max-width:300px;overflow:hidden;text-overflow:ellipsis}.inventory-table-wrap{overflow:auto;max-width:100%;-webkit-overflow-scrolling:touch}.inventory-pill{display:inline-block;padding:3px 8px;border-radius:99px;background:#fff0e8;color:#a85518;margin:2px;font-size:12px}.inventory-ok{background:#e9f7ef;color:#26815f}@media(max-width:800px){.inventory-kpis{grid-template-columns:repeat(2,1fr)}}
</style></head><body class="workbench-body"><div id="inventoryShell"></div><main class="workbench-main inventory-main"><div class="workbench-eyebrow">INVENTORY CONTROL</div><h1>库存监控预警</h1><p class="workbench-muted">按分仓快照识别缺货、缺配、滞销与积压。</p><div class="inventory-toolbar"><label>数据日期<input id="date" type="date"></label><label>口径<select id="view"><option value="sku" selected>独立 SKU</option><option value="all">全部（整套／SKU）</option><option value="product">整套／单品</option></select></label><label>预警<select id="alert"><option value="">全部</option><option value="LOW_STOCK">缺货风险</option><option value="NO_SALES_30">近30天无销售</option><option value="OVERSTOCK">库存积压</option><option value="PAIR_MISMATCH">内外机缺配</option></select></label><label>品牌<select id="brand"><option value="">全部</option></select></label><label>品类<select id="category"><option value="">全部</option></select></label><div class="inventory-actions"><button id="exportFollowups" disabled>导出处理清单</button><button id="refresh">刷新</button><button id="importButton">导入库存表</button><button id="confirmImport" hidden>确认入库</button><input id="importFile" type="file" accept=".xlsx,.xls,.csv" multiple hidden><a id="export" class="workbench-primary" style="padding:8px 14px;border-radius:8px;text-decoration:none;color:#fff" download>导出Excel</a></div></div><div id="status" role="status">正在加载…</div><section id="cards" class="inventory-kpis" hidden></section><section class="inventory-table-wrap"><table class="inventory-table" id="table" hidden><thead><tr><th>仓库</th><th>商品</th><th>单位</th><th>可用库存</th><th>可售天数</th><th>在库件数</th><th>良品</th><th>残品</th><th>销售出库</th><th>近7天出库</th><th>近15天出库</th><th>近30天出库</th><th>MTD周转</th><th>30天周转</th><th>业务预警</th><th>数据状态</th><th>处理跟进</th></tr></thead><tbody></tbody></table></section></main><script src="/js/workbench-session.js?v=20261016-replenishment"></script><script src="/js/workbench-shell.js?v=20261019-roles"></script><script src="/js/inventory/followups.js"></script><script src="/js/inventory/app.js?v=20261019-batch"></script></body></html>
