<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" type="image/svg+xml" href="/assets/brand/guanxingtai.svg"><title>库存监控 · 观星台</title><link rel="stylesheet" href="/css/workbench.css?v=20261030-skel2">
<link rel="stylesheet" href="/css/wb-theme.css?v=20261030-theme1"><style>.inventory-main{max-width:1500px}.inventory-toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:end;background:var(--u-card);border:1px solid var(--u-line);border-radius:var(--u-radius);box-shadow:var(--u-shadow);padding:16px;margin:16px 0}.inventory-toolbar label{display:grid;gap:4px;color:var(--u-sub);font-size:12px}.inventory-toolbar input,.inventory-toolbar select{min-height:38px;padding:7px;border:1px solid var(--u-line-strong);border-radius:var(--u-radius-s);background:var(--u-card);font-family:inherit;font-size:13px;color:var(--u-ink)}.inventory-actions{margin-left:auto;display:flex;gap:8px;align-items:center}.inventory-kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.inventory-kpi{background:var(--u-card-sub);border:1px solid var(--u-line);border-radius:var(--u-radius);padding:14px 16px;font-size:12px;font-weight:600;color:var(--u-sub)}.inventory-kpi strong{display:block;font-size:25px;margin-top:4px;color:var(--u-ink);font-variant-numeric:tabular-nums;font-weight:700}.inventory-table{width:100%;border-collapse:collapse;background:var(--u-card);border:1px solid var(--u-line);border-radius:var(--u-radius);overflow:hidden}.inventory-table th,.inventory-table td{padding:11px 12px;border-bottom:1px solid var(--u-line);text-align:left;white-space:nowrap;font-size:13px}.inventory-table tbody tr:hover td{background:#f7f9fc}.inventory-table th{font-size:12px;color:var(--u-sub);background:var(--u-card-sub);font-weight:600}.inventory-table th:nth-child(2),.inventory-table td:nth-child(2){width:300px;min-width:300px;max-width:300px;overflow:hidden;text-overflow:ellipsis}.inventory-table-wrap{overflow:auto;max-width:100%;-webkit-overflow-scrolling:touch}.inventory-pill{display:inline-flex;align-items:center;padding:2px 9px;border-radius:999px;background:var(--u-amber-soft);color:#8a5a12;margin:2px;font-size:12px;font-weight:600}.inventory-pill.inventory-ok{background:var(--u-green-soft);color:#116a35}.inventory-pill.inventory-danger{background:var(--u-red-soft);color:#a02020}#status{font-size:12.5px;color:var(--u-sub);margin:0 0 12px}@media(max-width:800px){.inventory-kpis{grid-template-columns:repeat(2,1fr)}}</style></head><body class="workbench-body"><div id="inventoryShell"></div><main class="workbench-main inventory-main"><div class="u-pagehead"><div><div class="u-eyebrow">INVENTORY CONTROL</div><h1>库存监控</h1><p class="u-desc">按分仓快照识别缺货、缺配、滞销与积压。</p></div></div><div class="inventory-toolbar"><label>数据日期<input id="date" type="date"></label><label>口径<select id="view"><option value="sku" selected>独立 SKU</option><option value="all">全部（整套／SKU）</option><option value="product">整套／单品</option></select></label><label>预警<select id="alert"><option value="">全部</option><option value="LOW_STOCK">缺货风险</option><option value="NO_SALES_30">近30天无销售</option><option value="OVERSTOCK">库存积压</option><option value="PAIR_MISMATCH">内外机缺配</option></select></label><label>品牌<select id="brand" data-multi><option value="">全部</option></select></label><label>品类<select id="category" data-multi><option value="">全部</option></select></label><div class="inventory-actions"><button id="exportFollowups" class="u-btn u-btn-ghost" disabled>导出处理清单</button><button id="refresh" class="u-btn u-btn-ghost">刷新</button><button id="importButton" class="u-btn u-btn-primary">导入库存表</button><button id="confirmImport" class="u-btn u-btn-primary" hidden>确认入库</button><input id="importFile" type="file" accept=".xlsx,.xls,.csv" multiple hidden><a id="export" class="u-btn u-btn-ghost" download>导出Excel</a></div></div><div id="status" role="status">正在加载…</div><section id="cards" class="inventory-kpis" hidden></section><section class="inventory-table-wrap"><table class="inventory-table" id="table" hidden><thead><tr><th>仓库</th><th>商品</th><th>单位</th><th>可用库存</th><th>可售天数</th><th>在库件数</th><th>良品</th><th>残品</th><th>销售出库</th><th>近7天出库</th><th>近15天出库</th><th>近30天出库</th><th>MTD周转</th><th>30天周转</th><th>业务预警</th><th>数据状态</th><th>处理跟进</th></tr></thead><tbody></tbody></table></section></main><script src="/js/workbench-session.js?v=20261030-px1"></script>
<script src="/js/filter-multi.js?v=20261102-fm5"></script><script src="/js/workbench-shell.js?v=20261030-shell2"></script><script src="/js/notifications-ui.js?v=20261030-ntf1"></script><script src="/js/command-palette.js?v=20261030-cmdk2"></script><script src="/js/inventory/followups.js"></script><script src="/js/inventory/app.js?v=20261030-theme1"></script></body></html>
