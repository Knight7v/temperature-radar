<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>功能参数对比 · 视觉设计</title><link rel="stylesheet" href="/css/workbench.css"><style>.compare-grid{display:grid;grid-template-columns:360px minmax(0,1fr);gap:24px;margin-top:24px}.compare-panel{background:white;padding:24px;border:1px solid #e0e6ef;border-radius:16px}.compare-panel label{display:grid;gap:6px;margin:14px 0}.compare-panel input,.compare-panel select,.compare-panel textarea{width:100%;font:inherit}.compare-panel textarea{min-height:100px;padding:10px;border:1px solid #cfd8e4;border-radius:8px}.compare-preview{position:sticky;top:20px;align-self:start}.compare-preview canvas{width:100%;max-height:75vh;object-fit:contain}.product-editor{border-top:1px solid #e0e6ef;margin-top:20px}.compare-note{font-size:12px;color:#66768a}.compare-actions{display:flex;gap:8px;flex-wrap:wrap}@media(max-width:950px){.compare-grid{grid-template-columns:1fr}.compare-preview{position:static}}</style></head><body class="workbench-body"><div id="shell"></div><main class="workbench-main"><div class="workbench-eyebrow">VISUAL STUDIO / COMPARISON</div><h1>功能参数对比</h1><p class="workbench-muted">看清产品差异，帮助顾客选择合适的一款。</p><div class="compare-grid"><section class="compare-panel"><label>海报标题<input id="headline" maxlength="32" value="好产品，一眼看懂"></label><label>商品数量<select id="count"><option value="3">三款商品</option><option value="2">两款商品</option></select></label><label>重点推荐<select id="featured"></select></label><label>导出宽度<select id="resolution"><option>1080</option><option>1440</option><option>2160</option></select></label><div id="products"></div><label>对比参数（每行：项目 | 商品1 | 商品2 | 商品3）<textarea id="parameters" placeholder="能效比 |  |  | &#10;制冷量 |  |  | "></textarea></label><p class="compare-note">最多 10 行，每格最多 40 字；填写实际参数及单位。推荐款由你指定，不自动判断性能优劣。</p><h2>AI 视觉背景</h2><p class="compare-note">API 尚未接入。提示词只描述背景，不包含商品参数。可上传另行生成的背景；商品图和文字始终单独排版。</p><label>背景描述<textarea id="artDirection">蓝黑科技风，蓝色霓虹光线，深色产品展台，右侧少量金色光效，顶部与下半部保留干净文字空间，无文字、无标志、无商品。</textarea></label><label>上传背景图片<input id="backgroundFile" type="file" accept="image/png,image/jpeg,image/webp"></label><button id="clearBackground">恢复模板背景</button><button id="promptDownload">下载 AI 提示词</button><button disabled title="待接入生成服务">AI 生成背景（待接入 API）</button></section><section class="compare-panel compare-preview"><h2>海报预览</h2><p class="compare-note" id="mode">模板预览 · 非 AI 生成</p><canvas id="poster" aria-label="功能参数对比海报"></canvas><p id="message" role="status">商品图片和参数尚未填写，导出时会保留占位提示。</p><button id="exportPoster" class="workbench-primary">下载对比海报 PNG</button></section></div></main><script src="/js/workbench-session.js"></script><script src="/js/workbench-shell.js"></script><script src="/js/comparison-provider.js"></script><script src="/js/comparison.js"></script></body></html>
