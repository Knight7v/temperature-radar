<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>视觉设计 · 商品主图</title><link rel="stylesheet" href="/css/workbench.css"><style>.design-grid{display:grid;grid-template-columns:320px minmax(0,1fr);gap:24px;margin-top:24px}.design-panel{padding:24px;background:white;border:1px solid var(--wb-line);border-radius:16px}.design-panel label{display:grid;gap:7px;margin-bottom:18px}.design-panel input,.design-panel select{width:100%}.preview{background:#eef1f6;display:grid;place-items:center;padding:24px;border-radius:12px}.preview canvas{width:100%;max-width:650px;height:auto;box-shadow:0 12px 32px #17243815}.design-heading{display:flex;justify-content:space-between;align-items:center;gap:12px}.design-heading span{color:#66768a;font-size:12px}#designMessage{min-height:24px}@media(max-width:950px){.design-grid{grid-template-columns:1fr}}</style></head><body class="workbench-body"><div id="designShell"></div><main class="workbench-main"><div class="workbench-eyebrow">VISUAL STUDIO</div><h1>商品主图工作室</h1><p class="workbench-muted">保留商品本来的样子，让卖点清晰呈现。</p><div class="design-grid"><section class="design-panel"><h2>素材与文案</h2><label>商品图片<input id="productFile" type="file" accept="image/png,image/jpeg,image/webp"></label><p class="workbench-muted">支持 PNG、JPG、WebP，最大 15 MB。建议使用白底图或透明底图；不自动抠图。</p><label>商品名称<input id="productName" maxlength="36" placeholder="例如：格力云之海空调"></label><label>卖点 1<input id="selling1" maxlength="24" placeholder="例如：舒适送风"></label><label>卖点 2<input id="selling2" maxlength="24" placeholder="例如：静音运行"></label><label>卖点 3<input id="selling3" maxlength="24" placeholder="例如：简约外观"></label><label>版式<select id="layout"><option value="center">商品居中</option><option value="split">左文右图</option></select></label><label>图片尺寸<select id="size"><option value="800">800 × 800</option><option value="1200" selected>1200 × 1200</option><option value="1600">1600 × 1600</option></select></label><label>背景<select id="background"><option value="#ffffff">纯净白</option><option value="#f0f5fa">雾蓝</option><option value="#f7f4ed">暖米色</option></select></label></section><section class="design-panel"><div class="design-heading"><h2>实时预览</h2><span>模板预览 · 非 AI 生成</span></div><div class="preview"><canvas id="artwork" width="1200" height="1200" aria-label="商品主图预览"></canvas></div><p id="designMessage" role="status">上传商品图片后即可下载。图片仅在本机浏览器处理。</p><button id="downloadDesign" class="workbench-primary" disabled>下载 PNG</button></section></div></main><script src="/js/workbench-session.js?v=20261016-replenishment"></script><script src="/js/workbench-shell.js?v=20261019-roles"></script><script src="/js/design.js"></script></body></html>
