<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>一页纸卖点 · 视觉设计</title><link rel="stylesheet" href="/css/workbench.css"><style>.editor{display:grid;grid-template-columns:350px minmax(0,1fr);gap:24px;margin-top:22px}.panel{padding:22px;background:white;border:1px solid #e0e6ef;border-radius:16px}.panel label{display:grid;gap:6px;margin:12px 0}.panel input,.panel select,.panel textarea{width:100%;font:inherit}.panel textarea{min-height:90px;border:1px solid #cfd8e4;border-radius:8px;padding:10px}.card-edit{border-top:1px solid #e0e6ef;margin-top:18px;padding-top:12px}.preview{position:sticky;top:18px;align-self:start}.preview canvas{width:100%;height:auto;background:#eee;max-height:75vh;object-fit:contain}.actions{display:flex;gap:8px;flex-wrap:wrap}.note{color:#66768a;font-size:12px}@media(max-width:950px){.editor{grid-template-columns:1fr}.preview{position:static}}</style></head><body class="workbench-body"><div id="shell"></div><main class="workbench-main"><div class="workbench-eyebrow">VISUAL STUDIO / SELLING POINTS</div><h1>一页纸卖点工作室</h1><p class="workbench-muted">从商品展示到购买理由，在一张图里说清楚。</p><div class="editor"><section class="panel"><label>模板<select id="template"><option value="long">完整长图版 · 大图＋卖点＋参数</option><option value="spec">参数说明版 · 卖点＋参数</option><option value="square">方形卖点图 · 五大卖点</option></select></label><label>商品名称<input id="name" maxlength="40" placeholder="输入商品名称"></label><label>主标题<input id="title" maxlength="20" value="您选择我们的"></label><label>主题色<input id="color" type="color" value="#d90000"></label><label>导出宽度<select id="width"><option>800</option><option>1200</option><option>1600</option></select></label><div id="heroFields"><h2>顶部商品大图</h2><label>商品／场景图片<input id="hero" type="file" accept="image/png,image/jpeg,image/webp"></label><label>顶部卖点标题<input id="heroTitle" maxlength="32" placeholder="填写核心卖点"></label></div><h2>五大卖点</h2><p class="note">每张卡片支持独立图片与文案；图片等比完整显示，不自动抠图。单图最大 15 MB。</p><div id="cards"></div><div id="specFields"><h2>产品参数</h2><label><span>显示参数表</span><input id="showSpecs" type="checkbox" checked></label><label>型号<input id="model" maxlength="40" placeholder="输入产品型号"></label><label>参数（每行：名称 | 数值 | 单位）<textarea id="specs" placeholder="宽度 | 910 | mm&#10;高度 | 1775 | mm"></textarea></label><label>补充说明<textarea id="note" maxlength="120" placeholder="填写安装或使用说明"></textarea></label></div></section><section class="panel preview"><h2>实时预览</h2><p class="note">模板合成 · 非 AI 生成 · 图片仅在浏览器本地处理</p><canvas id="canvas" aria-label="一页纸卖点预览"></canvas><p id="status" role="status">请补充商品图片和卖点文案。</p><button id="download" class="workbench-primary">下载 PNG</button></section></div></main><script src="/js/workbench-session.js?v=20261016-replenishment"></script><script src="/js/workbench-shell.js?v=20261019-roles"></script><script src="/js/selling.js"></script></body></html>
