<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" type="image/svg+xml" href="/assets/brand/guanxingtai.svg"><title>一页纸卖点 · 观星台</title><link rel="stylesheet" href="/css/workbench.css?v=20261030-skel2">
<link rel="stylesheet" href="/css/wb-theme.css?v=20261030-theme1"><style>.editor{display:grid;grid-template-columns:350px minmax(0,1fr);gap:24px;margin-top:20px}.panel{padding:22px;background:var(--u-card);border:1px solid var(--u-line);border-radius:var(--u-radius);box-shadow:var(--u-shadow)}.workbench-main>h1{font-size:22px;letter-spacing:0;margin:6px 0 4px}.workbench-main>.workbench-eyebrow{font-size:11px;letter-spacing:.14em;color:var(--u-blue);font-weight:700}.workbench-main>.workbench-muted{font-size:13px;color:var(--u-sub)}.panel h2{font-size:15px;margin:20px 0 4px}.panel label{display:grid;gap:6px;margin:12px 0;font-size:12px;font-weight:600;color:var(--u-ink-2)}.panel input,.panel select,.panel textarea{width:100%;font:inherit;color:var(--u-ink)}.panel input:not([type]),.panel input[type=text],.panel select,.panel textarea{border:1px solid var(--u-line-strong);border-radius:var(--u-radius-s);padding:9px 11px;background:var(--u-card)}.panel input[type=color]{padding:3px;min-height:38px}.panel textarea{min-height:90px;line-height:1.55}.card-edit{border-top:1px solid var(--u-line);margin-top:18px;padding-top:12px}.card-edit strong{font-size:13px;color:var(--u-ink)}.preview{position:sticky;top:18px;align-self:start}.preview canvas{width:100%;height:auto;background:var(--u-card-sub);max-height:75vh;object-fit:contain;border-radius:var(--u-radius-s)}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions button{border:1px solid var(--u-line-strong);border-radius:var(--u-radius-s);background:var(--u-card);color:var(--u-ink-2);padding:8px 14px;font-weight:600;cursor:pointer}.note{color:var(--u-faint);font-size:12px}#status,#heroStatus{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--u-sub);margin:10px 0}#status::before,#heroStatus::before{content:'';width:7px;height:7px;border-radius:50%;background:var(--u-blue);flex:none}#status.st-err,#heroStatus.st-err{color:#a02020}#status.st-err::before,#heroStatus.st-err::before{background:#dc2626}@media(max-width:950px){.editor{grid-template-columns:1fr}.preview{position:static}}</style></head><body class="workbench-body"><div id="shell"></div><main class="workbench-main"><div class="workbench-eyebrow">VISUAL STUDIO / SELLING POINTS</div><h1>一页纸卖点工作室</h1><p class="workbench-muted">从商品展示到购买理由，在一张图里说清楚。</p><div class="editor"><section class="panel"><label>模板<select id="template"><option value="long">完整长图版 · 大图＋卖点＋参数</option><option value="spec">参数说明版 · 卖点＋参数</option><option value="square">方形卖点图 · 五大卖点</option></select></label><label>商品名称<input id="name" maxlength="40" placeholder="输入商品名称"></label><label>主标题<input id="title" maxlength="20" value="您选择我们的"></label><label>主题色<input id="color" type="color" value="#d90000"></label><label>导出宽度<select id="width"><option>800</option><option>1200</option><option>1600</option></select></label><div id="heroFields"><h2>顶部商品大图</h2><label>商品／场景图片<input id="hero" type="file" accept="image/png,image/jpeg,image/webp"></label><label>顶部卖点标题<input id="heroTitle" maxlength="32" placeholder="填写核心卖点"></label><label>场景背景<textarea id="heroDirection" maxlength="180" placeholder="例如：客厅午后暖光，墙面留白，无文字无商品"></textarea></label><div class="actions"><button id="heroGenerate" type="button">AI 生成场景背景</button><button id="heroClear" type="button">恢复素色底</button></div><p class="note" id="heroStatus" role="status"></p></div><h2>五大卖点</h2><p class="note">每张卡片支持独立图片与文案；图片等比完整显示，不自动抠图。单图最大 15 MB。</p><div id="cards"></div><div id="specFields"><h2>产品参数</h2><label><span>显示参数表</span><input id="showSpecs" type="checkbox" checked></label><label>型号<input id="model" maxlength="40" placeholder="输入产品型号"></label><label>参数（每行：名称 | 数值 | 单位）<textarea id="specs" placeholder="宽度 | 910 | mm&#10;高度 | 1775 | mm"></textarea></label><label>补充说明<textarea id="note" maxlength="120" placeholder="填写安装或使用说明"></textarea></label></div></section><section class="panel preview"><h2>实时预览</h2><p class="note">模板合成 · 非 AI 生成 · 图片仅在浏览器本地处理</p><canvas id="canvas" aria-label="一页纸卖点预览"></canvas><p id="status" role="status">请补充商品图片和卖点文案。</p><button id="download" class="workbench-primary">下载 PNG</button></section></div></main><script src="/js/workbench-session.js?v=20261030-px1"></script>
<script src="/js/wb-toast.js?v=20261031-p1"></script><script src="/js/workbench-shell.js?v=20261030-shell2"></script><script src="/js/notifications-ui.js?v=20261030-ntf1"></script><script src="/js/command-palette.js?v=20261030-cmdk2"></script><script src="/js/design-ai.js?v=20261020-design1"></script><script src="/js/selling.js?v=20261031-p1"></script></body></html>
