<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>用户与权限 · 公司工作台</title><link rel="stylesheet" href="/css/workbench.css"><style>.users-card{background:#fff;border:1px solid var(--wb-line);border-radius:14px;padding:20px}.users-form{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px}.users-form input,.users-form select{min-height:40px}.users-table{width:100%;border-collapse:collapse}.users-table th,.users-table td{padding:12px;border-bottom:1px solid #edf0f4;text-align:left}.users-table select{padding:6px}</style></head><body class="workbench-body"><div id="shell"></div><main class="workbench-main"><div class="workbench-eyebrow">ACCESS CONTROL</div><h1>用户与权限</h1><p class="workbench-muted">管理本租户账号、角色和使用状态。</p><section class="users-card"><form id="create" class="users-form"><input name="displayName" placeholder="员工姓名" required><input name="identifier" placeholder="账号（邮箱或手机号）" required><input name="password" type="password" placeholder="初始密码（至少8位）" minlength="8" required><select name="role"><option value="operator">运营</option><option value="supply_chain">供应链</option><option value="viewer">查看用户</option><option value="admin">管理员</option></select><button class="workbench-primary">创建用户</button></form><p id="msg" role="status"></p><table class="users-table"><thead><tr><th>姓名</th><th>账号</th><th>角色</th><th>状态</th><th>创建时间</th></tr></thead><tbody id="rows"></tbody></table></section></main><script src="/js/workbench-session.js?v=20261016-replenishment"></script><script src="/js/workbench-shell.js?v=20261019-roles"></script><script src="/js/users.js?v=20261016-replenishment"></script></body></html>
