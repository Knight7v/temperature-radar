<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" type="image/svg+xml" href="/assets/brand/guanxingtai.svg"><title>用户与权限 · 观星台</title><link rel="stylesheet" href="/css/workbench.css?v=20261030-skel2"><link rel="stylesheet" href="/css/users.css?v=20261030-u6"></head><body class="workbench-body"><div id="shell"></div><main class="workbench-main u-root"><div class="u-pagehead"><div><div class="u-eyebrow">ACCESS CONTROL</div><h1>用户与权限</h1><p class="u-desc">管理本租户账号、角色和使用状态 · 账号改动全部留痕，可到「操作日志」追查。</p></div><div class="u-actions"><button type="button" class="u-btn u-btn-primary" id="goCreate">＋ 创建用户</button></div></div><p id="msg" role="status" class="u-msg"></p><nav class="u-tabs" id="userTabs" role="tablist" aria-label="用户与权限视图"><button type="button" data-view="users" class="on" role="tab" aria-selected="true">账号</button><button type="button" data-view="audit" role="tab" aria-selected="false">操作日志</button><button type="button" data-view="tasks" role="tab" aria-selected="false">定时任务</button><button type="button" data-view="dict" role="tab" aria-selected="false">数据字典</button><span class="u-tabs-hint">账号 / 角色 / 目标 / 复核的每一次改动都在「操作日志」里</span></nav><section class="u-view" id="viewUsers" aria-label="账号"><section class="u-card"><table class="users-table"><thead><tr><th>用户</th><th>角色</th><th>状态</th><th>创建时间</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table></section></section><section class="u-view" id="viewAudit" aria-label="操作日志" hidden><section class="u-card"><div class="u-card-head"><h2>操作日志</h2><span class="u-card-hint">谁在什么时候改了档案、目标、复核和账号，留痕可查。</span></div><div id="auditBox"></div></section></section><section class="u-view" id="viewTasks" aria-label="定时任务" hidden><section class="u-card"><div class="u-card-head"><h2>定时任务</h2><span class="u-card-hint">系统里三个自动任务的上次执行时间和结果，一眼看出有没有在跑。</span></div><div id="tasksBox"></div></section></section><section class="u-view" id="viewDict" aria-label="数据字典" hidden><section class="u-card"><div class="u-card-head"><h2>数据字典</h2><span class="u-card-hint">全站枚举的唯一真相（lib/dictionary.js）。改这里之前先确认 SQL 和页面没有依赖旧值。</span></div><div id="dictBox"></div></section></section></main><script src="/js/workbench-session.js?v=20261030-px1"></script><script src="/js/workbench-shell.js?v=20261030-shell2"></script><script src="/js/command-palette.js?v=20261030-cmdk2"></script><script src="/js/notifications-ui.js?v=20261030-ntf1"></script><script src="/js/dictionary.js?v=20261030-dict1"></script><script src="/js/audit-ui.js?v=20261030-audit2"></script><script src="/js/users.js?v=20261030-u6"></script><div class="u-modal-scrim" id="createScrim" hidden></div><div class="u-modal" id="createModal" hidden role="dialog" aria-modal="true" aria-labelledby="createTitle"><div class="u-modal-head"><div><h2 id="createTitle">创建用户</h2><p id="createDesc">填写基本信息，保存后立即生效，并记入「操作日志」。</p></div><button type="button" class="u-modal-x" id="createX" aria-label="关闭">✕</button></div><form id="create" class="u-modal-body" novalidate><label class="u-field">员工姓名<input name="displayName" placeholder="例如：张三" autocomplete="off" required></label><label class="u-field">账号（手机号）<input name="identifier" placeholder="用于登录，创建后不可修改" autocomplete="off" required></label><div class="u-field-row"><label class="u-field" id="pwLabel">初始密码<span class="u-pw"><input name="password" type="password" placeholder="至少 8 位" minlength="8" autocomplete="new-password" required><button type="button" class="u-eye" data-eye aria-label="显示密码" title="显示/隐藏密码">👁️</button></span></label><label class="u-field" id="pw2Label">再次输入密码<span class="u-pw"><input name="password2" type="password" placeholder="再输一遍，保持一致" minlength="8" autocomplete="new-password" required><button type="button" class="u-eye" data-eye aria-label="显示密码" title="显示/隐藏密码">👁️</button></span></label></div><label class="u-field">角色<select name="role"><option value="operator">运营</option><option value="supply_chain">供应链</option><option value="viewer">查看用户</option><option value="admin">管理员</option></select></label><p class="u-modal-err" id="createErr" hidden></p></form><div class="u-modal-foot"><button type="button" class="u-btn u-btn-ghost" id="createCancel">取消</button><button type="submit" form="create" class="u-btn u-btn-primary" id="createSave">保存并添加</button></div></div><script>
/* tab 切换（同质检页模式：data-view ↔ hidden 面板） */
(function(){
  const tabs=document.querySelectorAll('#userTabs [data-view]');
  const views={users:'viewUsers',audit:'viewAudit',tasks:'viewTasks',dict:'viewDict'};
  function show(name){
    tabs.forEach(b=>{const on=b.dataset.view===name;b.classList.toggle('on',on);b.setAttribute('aria-selected',on?'true':'false');});
    Object.entries(views).forEach(([k,id])=>{const el=document.getElementById(id);if(el)el.hidden=k!==name;});
  }
  tabs.forEach(b=>b.addEventListener('click',()=>show(b.dataset.view)));
  window.showUsersTab=show;
})();
</script></body></html>
