<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>数据分析管理</title><link rel="stylesheet" href="/css/workbench.css"><style>.sales-box{background:white;border:1px solid #e0e6ef;border-radius:14px;padding:22px;margin:20px 0}.sales-form{display:flex;flex-wrap:wrap;gap:12px;align-items:end}.sales-form label{display:grid;gap:5px}.sales-table{overflow:auto}.sales-table table{width:100%;border-collapse:collapse}.sales-table td,.sales-table th{padding:12px;text-align:left;border-bottom:1px solid #eee;white-space:nowrap}#salesMessage{white-space:pre-wrap}.sales-tabs{display:flex;gap:12px;flex-wrap:wrap}.date-bar{position:relative;display:flex;align-items:center;gap:18px;flex-wrap:wrap;border-top:4px solid #dce7ff;background:#fafbfc;padding:14px;margin-bottom:22px}.date-shortcuts{display:flex;gap:4px;flex-wrap:wrap}.date-shortcuts button{border:0;padding:6px 10px;background:transparent}.date-shortcuts button[aria-pressed=true]{background:white;color:#396aff;box-shadow:0 2px 8px #182b4920}#dateCurrent{font-size:13px;color:#526477}#datePanel{position:absolute;top:100%;left:0;z-index:45;width:330px;max-width:90vw;padding:16px;background:white;box-shadow:0 10px 40px #22335530;border-radius:10px}.date-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}.date-head button{padding:3px 8px;border:0;color:#396aff}.date-week{display:grid;grid-template-columns:repeat(8,1fr);align-items:center;text-align:center}.date-week button{border:0;border-radius:4px;padding:8px 0;font-size:13px}.date-week button:first-child{color:#729bff}.date-week .selected{background:#eaf0ff;color:#396aff}.date-week button:disabled{color:#bbb;cursor:default;background:#f8f8f8}.month-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.month-grid button{border:0}.date-custom{display:grid;gap:10px}</style><link rel="stylesheet" href="/css/sales-layout.css"></head><body class="workbench-body"><div id="shell"></div><main class="workbench-main"><div class="workbench-eyebrow">SALES ANALYTICS</div><h1>数据分析管理</h1><p>支付销售额 · 未扣退款 · 展示单位：万元</p><p id="salesMessage" role="status"></p><section id="overview" class="sales-box"><div class="sales-overview-heading"><h2>销售概况</h2><div id="dateBar" class="date-bar"><span id="dateCurrent"></span><div class="date-shortcuts"><button disabled title="当前通过文件导入，暂不支持实时数据">实时</button><button data-date="yesterday">昨天</button><button data-date="7">近7天</button><button data-date="30">近30天</button><button data-date="day">天</button><button data-date="week">周</button><button data-date="month">月</button><button data-date="custom">自定义</button></div><div id="datePanel" hidden></div></div></div><input id="start" type="hidden"><input id="end" type="hidden"><input id="grain" type="hidden"><div class="sales-form sales-filters"><label>店铺<select id="shopFilter"></select></label><label>店铺状态<select id="shopStatus"><option value="current">当前经营（排除已闭店）</option><option value="all">全部状态（含历史闭店）</option><option>运营中</option><option>闭店中</option><option>已闭店</option><option value="unknown">未填写</option></select></label><label>品牌<select id="brand"></select></label><label>平台<select id="platform"></select></label><label>负责人<select id="owner"></select></label><label>执行人<select id="executor"></select></label><div class="sales-filter-actions"><button id="query" class="workbench-primary">查询</button><button id="resetFilters">重置</button><button id="export">导出 Excel</button></div></div><p id="summary"></p><p>缺失日期不作为零销售；筛选与汇总使用当前店铺档案。部分周期的达成率按已导入金额计算，不代表完整周期业绩。</p><div id="yearViewToggle" class="sales-view-toggle" role="group" aria-label="年度数据展示方式" hidden><span>数据展示</span><button type="button" data-year-view="annual" aria-pressed="true">年累计</button><button type="button" data-year-view="monthly" aria-pressed="false">月度明细</button></div><div id="report" class="sales-table"></div></section><section id="shops" class="sales-box" hidden><h2>店铺档案</h2><form id="shopForm" class="sales-form"></form><div id="shopList" class="sales-table"></div></section><section id="import" class="sales-box" hidden><h2>导入京东每日报表</h2><p>上传原始 XLSX（最大3MB），须含“时间”“成交金额”，金额单位为元；成交金额中的“-”按0元导入，空白金额仍需补齐。本期只接入每日明细，自动生成各周期统计。</p><p>文件名以店铺ID开头时自动匹配；无法匹配时请先完善档案。无ID文件可手动选择店铺。</p><label>导入店铺 <select id="importShop"></select></label><p id="importMatch" role="status"></p><input id="file" type="file" accept=".xlsx"><button id="preview">校验与预览</button><div id="diff" class="sales-table"></div><button id="confirm" hidden>确认导入（覆盖已列出的变更日期）</button></section><section id="targets" class="sales-box" hidden><h2>目标管理</h2><button id="openAnnualTargets" type="button">年度／月度目标设置</button><form id="targetForm" class="sales-form"><label>店铺<select id="targetShop"></select></label><label>周期<input name="period" placeholder="2026-10 或 2026-Q4" required></label><label>目标（万元）<input name="amount" type="number" min="0" step="0.000001" required></label><button>保存目标</button></form><div id="targetList" class="sales-table"></div></section><section id="logs" class="sales-box" hidden><h2>导入记录</h2><div id="logList" class="sales-table"></div></section></main><script src="/js/workbench-session.js?v=20261016-replenishment"></script><script src="/js/workbench-shell.js?v=20261016-replenishment"></script><script src="/js/sales-dates.js"></script><script src="/js/sales-policy.js"></script><script src="/js/sales-targets.js"></script><script src="/js/sales.js"></script></body></html>
